<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edu-arena</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #f7f4ee;
    --line: #d8d2c4;
    --accent: #7a5c3e;
    --accent2: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 48px 24px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: #6b6459;
    font-size: 15px;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .axis-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 32px 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .card {
    display: block;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: white;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card.disabled {
    color: #b0aa9c;
    cursor: default;
    pointer-events: none;
    background: transparent;
  }
  .card .name { font-size: 16px; font-weight: 600; }
  .card .meta { font-size: 12px; color: #8a8378; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>edu-arena</h1>
  <p>학습 콘텐츠 + 실력 측정 · 12개 과정 · 3단계(고졸 / 대학 1년 / 대학 2년 수료)</p>
</header>
<main>
  <div class="axis-title">인문사회</div>
  <div class="grid">
    <a class="card" href="player.html?subject=history&level=1">
      <div class="name">역사 · 1단계</div>
      <div class="meta">25문항 (목표 500)</div>
    </a>
    <div class="card disabled"><div class="name">지리</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">일반사회</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">정치와 법</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">경제</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">문화</div><div class="meta">준비 중</div></div>
  </div>

  <div class="axis-title">STEM</div>
  <div class="grid">
    <div class="card disabled"><div class="name">수학</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">물리</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">화학</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">생물</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">지구과학</div><div class="meta">준비 중</div></div>
    <div class="card disabled"><div class="name">공학</div><div class="meta">준비 중</div></div>
  </div>
</main>
</body>
</html>
