<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코스 · 외국어 · edu-arena</title>
<meta name="description" content="영어, 일본어, 중국어, 프랑스어, 독일어, 스페인어. CEFR A1부터 C2까지 언어별 300유닛의 쓰기·말하기 과제와 기존 객관식 과정.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFBFD;--ink:#172033;--ink-soft:#4A5670;--grid:#DCE4F0;--grid-strong:#B9C7DD;--blue:#1D3FA8;--blue-soft:#E7ECFA;--marker:#FFD84D;--ok:#1E7A50;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);font-family:var(--font)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--grid)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;font-size:18px;text-decoration:none;letter-spacing:-.01em}
.logo span{background:linear-gradient(transparent 58%,var(--marker) 58%)}
.toplinks a{font-size:15px;color:var(--blue);margin-left:14px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:40px;padding:36px 0 80px}
nav details{margin:0 0 6px}
nav summary{list-style:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-soft);padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between}
nav summary::-webkit-details-marker{display:none}
nav summary::after{content:"+";font-weight:700}
nav details[open] summary::after{content:"–"}
nav summary:hover{background:var(--blue-soft)}
nav ol{list-style:none;margin:2px 0 8px;padding:0;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;gap:10px;padding:8px 10px 8px 18px;border-radius:8px;text-decoration:none;font-size:16px}
nav a[aria-current]{background:var(--blue-soft);color:var(--blue);font-weight:700}
nav a:hover{background:var(--blue-soft)}
.course-head .eyebrow{font-size:14px;color:var(--ink-soft);margin:0 0 6px}
.course-head h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em}
.course-head p{margin:0 0 30px;color:var(--ink-soft);font-size:17px;line-height:1.6}
.chapter{border-top:2px solid var(--ink);padding:18px 0 26px}
.chapter h2{margin:0 0 14px;font-size:21px;display:flex;gap:12px;align-items:baseline}
.chapter h2 .no{font-size:15px;color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.items a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--grid);text-decoration:none;font-size:17px}
.items a:hover{background:var(--blue-soft)}
.items .state{width:18px;height:18px;border:2px solid var(--grid-strong);border-radius:50%}
.items .meta{font-size:14px;color:var(--ink-soft);white-space:nowrap}
.empty{padding:24px;border:2px dashed var(--grid-strong);border-radius:10px;color:var(--ink-soft);line-height:1.6}
@media (max-width:760px){.layout{grid-template-columns:1fr;gap:20px}.course-head h1{font-size:28px}.toplinks a{margin-left:10px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:-14px 0 26px}
.tabs a{font-size:15px;padding:8px 14px;border:1px solid var(--grid-strong);border-radius:999px;text-decoration:none;color:var(--ink-soft)}
.tabs a[aria-current]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.note{background:#fff;border:1px solid var(--grid);border-radius:12px;padding:16px 18px;margin:0 0 26px;font-size:16px;line-height:1.6;color:var(--ink-soft)}
.note a{color:var(--blue);font-weight:700}
.items .t small{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px}
.items a.check{font-weight:700;color:var(--blue)}
.chapter h2 .sub{font-size:15px;color:var(--ink-soft);font-weight:500}
</style>
<link rel="stylesheet" href="../assets/ea-header.css">
</head>
<body>
<header class="ea-head"><div class="ea-in"><div class="ea-brand"><a class="ea-logo" href="../"><span>edu-arena</span></a><a class="ea-subj" href="browse.html">외국어</a></div><div class="ea-links"><a href="browse.html" aria-current="page">코스</a><a href="placement.html?lang=en" id="navPlace">배치고사</a></div></div></header>
<div class="wrap layout">
  <nav aria-label="외국어 코스" id="nav"></nav>
  <main id="main"><div class="empty">코스를 불러오는 중입니다.</div></main>
</div>
<script>
"use strict";
const P = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const nav = document.getElementById("nav"), main = document.getElementById("main");

const LANGS = [
  ["en", "영어", "English"], ["ja", "일본어", "日本語"], ["zh", "중국어", "中文"], ["fr", "프랑스어", "Français"],
  ["de", "독일어", "Deutsch"], ["es", "스페인어", "Español"]];
const LEVELS = [["a1", "첫 단어"], ["a2", "일상 대화"], ["b1", "실전 대화"], ["b2", "자신 있는 유창함"], ["c1", "섬세한 구사력"], ["c2", "원어민 감각"]];
const FMT = { new: "쓰기 · 말하기", classic: "객관식 (기존 형식)" };

let LANG = (P.get("lang") || "en").toLowerCase();
if (!LANGS.some(l => l[0] === LANG)) LANG = "en";
let F = P.get("fmt") === "classic" ? "classic" : "new";
document.getElementById("navPlace").href = `placement.html?lang=${LANG}`;

function buildNav() {
  nav.innerHTML = LANGS.map(([k, name]) => {
    const items = Object.keys(FMT).map(f => {
      const on = k === LANG && f === F;
      return `<li><a href="?lang=${k}${f === "classic" ? "&fmt=classic" : ""}"${on ? ' aria-current="page"' : ""}>${esc(FMT[f])}</a></li>`;
    }).join("");
    return `<details${k === LANG ? " open" : ""}><summary>${esc(name)}</summary><ol>${items}</ol></details>`;
  }).join("");
}

function row(href, label, sub, meta, cls) {
  return `<li><a href="${href}"${cls ? ` class="${cls}"` : ""}><span class="state"></span><span class="t">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="meta">${esc(meta)}</span></a></li>`;
}

function render(cat) {
  const L = LANGS.find(l => l[0] === LANG), data = cat[LANG];
  document.title = `${L[1]} · ${FMT[F]} · 외국어 · edu-arena`;
  const tabs = Object.keys(FMT).map(f => `<a href="?lang=${LANG}${f === "classic" ? "&fmt=classic" : ""}"${f === F ? ' aria-current="page"' : ""}>${esc(FMT[f])}</a>`).join("");
  const desc = F === "new"
    ? "CEFR A1부터 C2까지 레벨마다 50유닛입니다. 유닛마다 짧은 핵심 표현 설명을 읽고 쓰기 2문항, 말하기 2문항을 풉니다. 레벨을 마치면 체크포인트로 확인하세요."
    : "레벨마다 20유닛, 유닛마다 25문항의 객관식 문제입니다. 설명 레슨을 읽고 바로 풀어 볼 수 있습니다.";
  let out = `<div class="course-head"><p class="eyebrow">외국어 · ${esc(L[2])}</p><h1>${esc(L[1])}</h1><p>${esc(desc)}</p></div>` +
    `<div class="tabs" role="tablist" aria-label="형식">${tabs}</div>`;
  if (F === "new") out += `<p class="note">어느 레벨에서 시작할지 모르겠다면 <a href="placement.html?lang=${LANG}">배치고사</a>로 시작 위치를 찾으세요. 쓰기 과제 몇 개로 알맞은 레벨을 추천합니다.</p>`;
  LEVELS.forEach(([lv, lname]) => {
    const units = data[lv][F];
    if (!units.length) return;
    let rows = units.map(([n, t, orig]) => {
      const href = F === "new" ? `task.html?lang=${LANG}&level=${lv}&unit=${pad(n)}` : `lesson.html?lang=${LANG}&level=${lv}&unit=${pad(n)}`;
      return row(href, `${pad(n)}  ${t}`, orig && orig !== t ? orig : "", F === "new" ? "쓰기 2 · 말하기 2" : "25문항");
    }).join("");
    if (F === "new") rows += row(`checkpoint.html?lang=${LANG}&level=${lv}`, `${lv.toUpperCase()} 체크포인트`, "레벨을 마쳤는지 쓰기·말하기로 확인", "레벨 평가", "check");
    out += `<section class="chapter" id="${lv}"><h2><span class="no">${lv.toUpperCase()}</span>${esc(lname)} <span class="sub">${units.length}유닛</span></h2><ol class="items">${rows}</ol></section>`;
  });
  main.innerHTML = out;
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}

buildNav();
fetch("content/catalog.json").then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => { main.innerHTML = `<div class="empty">코스 정보를 불러오지 못했습니다.</div>`; });
</script>
</body>
</html>
